<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Hangman</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="glass-panel">
                <h1 class="glitch-text" data-text="CRIME HANGMAN">CRIME HANGMAN</h1>
                <p class="subtitle">Vocabulary Training Protocol</p>
                
                <div class="setup-controls">
                    <label for="player-count">Number of Investigators:</label>
                    <div class="number-input-group">
                        <button id="btn-decrease">-</button>
                        <input type="number" id="player-count" value="1" min="1" max="4" readonly>
                        <button id="btn-increase">+</button>
                    </div>
                    <button id="btn-start" class="btn-primary">START MISSION</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <header class="game-header">
                <div id="player-turn-badge" class="badge">Player 1's Turn</div>
                <div id="score-board" class="score-board">
                    <!-- Scores injected here -->
                </div>
            </header>

            <main class="game-container">
                <div class="hangman-display glass-panel">
                    <svg height="250" width="200" class="figure-container">
                        <!-- Gallows -->
                        <line x1="10" y1="240" x2="150" y2="240" class="draw-line" />
                        <line x1="80" y1="240" x2="80" y2="20" class="draw-line" />
                        <line x1="80" y1="20" x2="140" y2="20" class="draw-line" />
                        <line x1="140" y1="20" x2="140" y2="50" class="draw-line" />
                        <!-- Head -->
                        <circle cx="140" cy="70" r="20" class="figure-part" />
                        <!-- Body -->
                        <line x1="140" y1="90" x2="140" y2="150" class="figure-part" />
                        <!-- Arms -->
                        <line x1="140" y1="100" x2="120" y2="130" class="figure-part" />
                        <line x1="140" y1="100" x2="160" y2="130" class="figure-part" />
                        <!-- Legs -->
                        <line x1="140" y1="150" x2="120" y2="190" class="figure-part" />
                        <line x1="140" y1="150" x2="160" y2="190" class="figure-part" />
                    </svg>
                </div>
                
                <div class="game-interaction">
                    <div id="hint-container" class="hint-container">
                        <p id="target-clue" class="target-clue">Target: <span id="clue-text"></span></p>
                        <button id="btn-hint" class="btn-secondary">Get Intel (Reveal Letter)</button>
                    </div>

                    <div id="word-display" class="word-display">
                        <!-- Letters injected here -->
                    </div>

                    <div id="keyboard" class="keyboard">
                        <!-- Keyboard buttons injected here -->
                    </div>
                </div>
            </main>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <div class="glass-panel end-panel">
                <h2 id="end-title"></h2>
                <p id="end-word-reveal"></p>
                <div id="final-scores" class="final-scores"></div>
                <button id="btn-restart" class="btn-primary">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <!-- Notification popup -->
    <div id="notification-container" class="notification-container">
        <p id="notification-text"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
